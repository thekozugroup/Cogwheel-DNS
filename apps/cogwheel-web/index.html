<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Cogwheel DNS control plane" />
    <!-- The same mark as docs/assets/logo.svg and the in-product <Mark> component: filled
         rectangles, no strokes. The scheme is black and white and has no brand hue, so the
         tile follows the browser chrome rather than picking a grey that is wrong in both
         themes. A browser that ignores the media query gets the light fill, which is the
         one that matches a default tab strip. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3Epath%7Bfill:%230a0a0a%7D@media(prefers-color-scheme:dark)%7Bpath%7Bfill:%23fafafa%7D%7D%3C/style%3E%3Cpath d='M10 2h4v2h-4zM6 4h12v2H6zM4 6h16v2H4zM4 8h4v8H4zM16 8h4v8h-4zM2 10h2v4H2zM20 10h2v4h-2zM4 16h16v2H4zM6 18h12v2H6zM10 20h4v2h-4z'/%3E%3C/svg%3E" />
    <title>Cogwheel Control Plane</title>
    <script>
      // Runs before the first paint so the theme never flashes. Kept inline and
      // dependency-free on purpose: any bundled alternative resolves too late.
      (function () {
        try {
          var stored = localStorage.getItem("cogwheel-theme");
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cogwheel's control plane needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
