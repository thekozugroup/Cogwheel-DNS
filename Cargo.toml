[workspace]
members = [
  "apps/cogwheel-server",
  "crates/cogwheel-dns-core",
  "crates/cogwheel-lists",
  "crates/cogwheel-policy",
  "crates/cogwheel-storage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Tachyon Labs"]
repository = "https://github.com/thekozugroup/Cogwheel-DNS"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
hickory-proto = "0.26"
# tls-ring/https-ring add DNS-over-TLS and DNS-over-HTTPS upstreams. `ring` and
# not `aws-lc-rs` because reqwest already pulls rustls with ring for the
# blocklist fetcher, and one crypto provider in the tree is enough -- two would
# be a second implementation to audit and to cross-compile for aarch64.
#
# webpki-roots is NOT optional here, however much it looks like it. hickory
# builds its TLS client config as:
#
#     let mut root_store = RootCertStore::empty();
#     #[cfg(feature = "webpki-roots")]
#     root_store.extend(webpki_roots::TLS_SERVER_ROOTS...);
#
# so with tls-ring alone the store is EMPTY and every certificate fails to
# validate -- DoT and DoH compile, connect, and then never resolve a single
# name. Measured: DoH returned SERVFAIL on every query until this was added.
#
# webpki-roots rather than rustls-platform-verifier so the trust anchors are
# the same ones reqwest already uses for the blocklist fetcher, and so a native
# install on a host with a missing or broken /etc/ssl does not lose DNS. The
# tradeoff is that roots update with this crate rather than with the OS.
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tls-ring",
    "https-ring",
    "webpki-roots",
] }
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
