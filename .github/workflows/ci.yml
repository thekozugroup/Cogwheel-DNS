name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the previous run irrelevant. Cancelling
# it keeps arm64 runner minutes from piling up behind superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `rustup show` installs exactly what rust-toolchain.toml names -- the
      # pinned channel plus its components and targets -- so this job runs the
      # same compiler, and therefore the same lint set, as a developer's laptop.
      # Using @stable here instead is what made this workflow fail on eight
      # consecutive commits: 1.97 added lints nobody could see before pushing.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # --locked fails if Cargo.lock does not satisfy the manifests. Without it
      # a dependency bump can land in CI green and then resolve differently in
      # the release build, which is exactly the class of bug that only shows up
      # on the appliance.
      - name: Build (locked)
        run: cargo build --release --locked -p cogwheel-server

      - name: Audit
        run: cargo audit

      - name: Deny
        run: cargo deny check

  # The reference deployment target is a Raspberry Pi 5, so aarch64 has to be a build the CI
  # actually performs rather than one the docs assume.
  aarch64:
    name: aarch64 (Raspberry Pi target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # aarch64-unknown-linux-gnu is listed in rust-toolchain.toml, so the pin
      # brings the cross target with it and there is no second place to update.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: Cross-compile the server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu -p cogwheel-server

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cogwheel-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cogwheel-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc --noEmit -p tsconfig.app.json && vite build`,
      # so this one step covers both typecheck and bundle.
      - name: Typecheck and build
        run: npm run build

      # The appliance is a Raspberry Pi serving this bundle to phones on a
      # home network. Printing the size every run makes a regression visible
      # in the log instead of six months later.
      - name: Report bundle size
        run: |
          {
            echo "### Web bundle"
            echo '```'
            du -sh dist
            find dist/assets -type f \( -name '*.js' -o -name '*.css' \) \
              -exec du -h {} + | sort -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/cogwheel-web/dist
          retention-days: 7

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # GitHub-hosted arm64 runners. Building arm64 natively rather than
          # under QEMU is the difference between minutes and hours for a Rust
          # workspace. If this label is not available to the repository,
          # replace it with ubuntu-latest plus docker/setup-qemu-action and
          # expect a much longer job.
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lint the Dockerfile
        run: docker buildx build --check .

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # Load it into the daemon so the smoke steps below can RUN it. Each
          # matrix leg runs on its own native architecture, so the arm64 image
          # is exercised on real arm64 hardware -- the Raspberry Pi target.
          load: true
          tags: cogwheel:ci
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}

      # Everything below exists because "the image builds" was the only thing
      # ever checked, and a build says nothing about whether the container can
      # start. A documented deployment that died at execve passed CI for weeks.
      - name: It must refuse to start without NET_BIND_SERVICE
        run: |
          set -uo pipefail
          # The binary carries cap_net_bind_service=+ep, so execve returns EPERM
          # when the capability is missing from the bounding set -- regardless
          # of which port it would bind. This asserts the behaviour rather than
          # the docs' former claim that bridge mode "needs no capability", so
          # nobody re-adds that advice. If the setcap line is ever dropped, this
          # step fails and the comments in docker-compose.yml get revisited.
          docker run --name capcheck -d --cap-drop ALL \
            -e COGWHEEL_SERVER__DNS_UDP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_SERVER__DNS_TCP_BIND_ADDR=0.0.0.0:5353 \
            --read-only --tmpfs /tmp:rw,size=64m --init cogwheel:ci >/dev/null 2>&1 || true
          sleep 5
          STATUS=$(docker inspect -f '{{.State.Status}}' capcheck 2>/dev/null || echo missing)
          LOGS=$(docker logs capcheck 2>&1 || true)
          echo "status=${STATUS}"; echo "${LOGS}"
          docker rm -f capcheck >/dev/null 2>&1 || true
          case "$LOGS" in
            *"Operation not permitted"*)
              echo "as expected: the image will not exec without the capability"; exit 0 ;;
          esac
          if [ "$STATUS" = "running" ]; then
            echo "::error::the image started without NET_BIND_SERVICE -- the setcap file capability may have been dropped, which would break the non-root :53 bind"
            exit 1
          fi
          echo "::warning::container did not run, but not for the expected capability reason (status=${STATUS})"

      - name: It must actually serve DNS and the web UI
        run: |
          set -euo pipefail
          docker volume create cogwheel-ci >/dev/null
          # The hardening scripts/install.sh applies, in bridge mode so the
          # runner's own systemd-resolved on :53 is not in the way.
          docker run --name cogwheel-ci -d \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            -p 15353:5353/udp -p 15353:5353/tcp -p 18080:8080/tcp \
            -e COGWHEEL_SERVER__HTTP_BIND_ADDR=0.0.0.0:8080 \
            -e COGWHEEL_SERVER__DNS_UDP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_SERVER__DNS_TCP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_STORAGE__DATABASE_URL=sqlite:///app/data/cogwheel.db \
            -v cogwheel-ci:/app/data --read-only --tmpfs /tmp:rw,size=64m --init \
            cogwheel:ci

          # Readiness is the strong signal: 503 until storage, policy AND the
          # DNS listeners are all up, so it also proves SQLite can be written
          # on a read-only rootfs.
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:18080/health/ready && break
            sleep 3
          done
          curl -fsS --max-time 3 http://127.0.0.1:18080/health/ready

          test "$(docker exec cogwheel-ci id -u)" = "10001"
          echo "runs as uid 10001"

          for route in / /activity /devices /lists /settings; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:18080${route}")
            test "$code" = "200" || { echo "::error::GET ${route} -> ${code}"; exit 1; }
          done
          # Status AND body: the SPA fallback can regress into serving index.html
          # under a 404, which spec section 3 forbids and which no status check sees.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18080/api/v1/definitely-not-real)
          test "$code" = "404" || { echo "::error::unknown API path -> ${code}, expected 404"; exit 1; }
          type=$(curl -s -o /dev/null -w '%{content_type}' --max-time 10 http://127.0.0.1:18080/api/v1/definitely-not-real)
          case "$type" in
            application/json*) ;;
            *) echo "::error::unknown API path content-type ${type}, expected application/json"; exit 1 ;;
          esac
          body=$(curl -s --max-time 10 http://127.0.0.1:18080/api/v1/definitely-not-real)
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if isinstance(d.get("error"), str) else 1)' "$body" \
            || { echo "::error::unknown API path body was not {\"error\": ...}: ${body}"; exit 1; }
          echo "web routes and API 404 behaviour correct"

          # A response of any rcode proves the listener and parser work; the
          # runner's egress to upstream :53 is not this test's concern.
          python3 - <<'PY'
          import socket, struct, random, sys
          tid = random.randint(0, 65535)
          pkt = struct.pack('>HHHHHH', tid, 0x0100, 1, 0, 0, 0) \
              + b''.join(bytes([len(l)]) + l.encode() for l in "example.com".split('.')) \
              + b'\x00' + struct.pack('>HH', 1, 1)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(15)
          s.sendto(pkt, ('127.0.0.1', 15353))
          try:
              d, _ = s.recvfrom(4096)
          except Exception as e:
              print(f"::error::no DNS response from the container: {e}"); sys.exit(1)
          print(f"DNS answered: rcode={d[3] & 0xF} answers={struct.unpack('>H', d[6:8])[0]}")
          PY

          # A household block rule needs no upstream and no subscribed list, so this
          # proves filtering end to end with zero egress -- the one DNS assertion in
          # this job that does not depend on the runner having internet access.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"domain":"blocked.test","action":"block"}' \
            http://127.0.0.1:18080/api/v1/rules)
          test "$code" = "200" || { echo "::error::POST /api/v1/rules -> ${code}"; exit 1; }

          python3 - <<'PY'
          import socket, struct, random, sys
          tid = random.randint(0, 65535)
          pkt = struct.pack('>HHHHHH', tid, 0x0100, 1, 0, 0, 0) \
              + b''.join(bytes([len(l)]) + l.encode() for l in "blocked.test".split('.')) \
              + b'\x00' + struct.pack('>HH', 1, 1)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(15)
          s.sendto(pkt, ('127.0.0.1', 15353))
          try:
              d, _ = s.recvfrom(4096)
          except Exception as e:
              print(f"::error::no DNS response for the blocked marker domain: {e}"); sys.exit(1)
          rcode = d[3] & 0xF
          ancount = struct.unpack('>H', d[6:8])[0]
          i = 12
          while d[i] != 0:
              i += 1 + d[i]
          i += 5  # the null label, then qtype and qclass
          a_record = None
          for _ in range(ancount):
              i += 2  # name, always a compression pointer here
              rtype, _, _, rdlen = struct.unpack('>HHIH', d[i:i + 10]); i += 10
              if rtype == 1 and rdlen == 4:
                  a_record = '.'.join(str(b) for b in d[i:i + 4])
              i += rdlen
          print(f"blocked.test answered: rcode={rcode} a={a_record}")
          if rcode != 0 or a_record != "0.0.0.0":
              print("::error::expected rcode 0 (NOERROR) and A 0.0.0.0 for a blocked household rule")
              sys.exit(1)
          PY

          # The installer waits on Docker's healthcheck, so it has to pass.
          for _ in $(seq 1 40); do
            h=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' cogwheel-ci)
            [ "$h" = "healthy" ] && break
            sleep 3
          done
          test "$h" = "healthy" || { echo "::error::HEALTHCHECK reported '${h}'"; docker logs cogwheel-ci; exit 1; }
          echo "HEALTHCHECK healthy"

          # SIGTERM must be handled: install.sh runs with --stop-timeout 20.
          start=$(date +%s)
          docker stop cogwheel-ci >/dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 20 || { echo "::error::took ${elapsed}s to stop; SIGTERM is not being handled"; exit 1; }

      - name: It must upgrade a v0 database in place
        run: |
          set -euo pipefail
          # The Rust test covers the v0 -> v1 upgrade in-process against a fixture.
          # This is the other half, and the form the operation actually takes in a
          # household: the shipped image, started on a volume that already holds a
          # v0 file. It was a manual gate step, which is to say nothing that runs.
          mkdir -p "${RUNNER_TEMP}/v0"
          python3 - "${RUNNER_TEMP}/v0/cogwheel.db" <<'PY'
          import glob, sqlite3, sys

          db = sqlite3.connect(sys.argv[1])
          db.execute("PRAGMA journal_mode=WAL")
          # The same eleven files the Rust fixture executes, so the two cannot drift.
          for path in sorted(glob.glob("crates/cogwheel-storage/tests/fixtures/legacy/*.sql")):
              with open(path, encoding="utf-8") as handle:
                  db.executescript(handle.read())
          db.execute(
              "INSERT INTO devices (id, name, ip_address, policy_mode, created_at, updated_at)"
              " VALUES (?, 'Kids Tablet', '192.168.1.50', 'global',"
              "         '2024-02-02 12:00:00', '2024-02-02 12:00:00')",
              ("aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee",),
          )
          db.commit()
          # Fold the WAL back into the file being copied; only the .db travels.
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          db.close()
          PY

          docker volume create cogwheel-upgrade >/dev/null
          # Root and a shell only to place the file. The server below still runs as 10001,
          # and the file it inherits is owned the way an installed one would be.
          docker run --rm --user 0 --entrypoint /bin/sh \
            -v cogwheel-upgrade:/app/data -v "${RUNNER_TEMP}/v0:/seed:ro" cogwheel:ci \
            -c 'cp /seed/cogwheel.db /app/data/cogwheel.db && chown 10001:10001 /app/data/cogwheel.db'

          docker run --name cogwheel-upgrade -d \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            -p 18081:8080/tcp \
            -e COGWHEEL_SERVER__HTTP_BIND_ADDR=0.0.0.0:8080 \
            -e COGWHEEL_SERVER__DNS_UDP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_SERVER__DNS_TCP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_STORAGE__DATABASE_URL=sqlite:///app/data/cogwheel.db \
            -v cogwheel-upgrade:/app/data --read-only --tmpfs /tmp:rw,size=64m --init \
            cogwheel:ci

          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:18081/health/ready && break
            sleep 3
          done
          curl -fsS --max-time 3 http://127.0.0.1:18081/health/ready
          echo "the upgraded database reached ready"

          # The rollback copy belongs on the volume, beside the database: an operator
          # putting yesterday's data back has nowhere else to look for it.
          docker exec cogwheel-upgrade test -f /app/data/cogwheel.db.pre-v1 \
            || { echo "::error::no cogwheel.db.pre-v1 beside the upgraded database"; exit 1; }
          echo "the pre-upgrade backup is on the volume"

          # Carried across with its id intact. A renumbered device id is a device
          # whose rules and list choices silently belong to nobody.
          body=$(curl -fsS --max-time 10 http://127.0.0.1:18081/api/v1/devices)
          python3 - "$body" <<'PY'
          import json, sys

          devices = json.loads(sys.argv[1])["data"]["devices"]
          seeded = [d for d in devices if d["id"] == "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"]
          if not seeded:
              print(f"::error::the v0 device did not survive the upgrade: {devices}")
              sys.exit(1)
          device = seeded[0]
          if device["name"] != "Kids Tablet" or device["ip_address"] != "192.168.1.50":
              print(f"::error::the v0 device came back changed: {device}")
              sys.exit(1)
          print(f"carried across: {device['name']} at {device['ip_address']}")
          PY

          docker stop cogwheel-upgrade >/dev/null

      # The other direction, and the one that takes a household's DNS down for
      # real: an OLD image started on a volume a NEWER image has already
      # migrated. Storage reads `user_version`, finds a number it does not
      # understand, and refuses -- correctly. What matters is that the refusal
      # is legible, because `restart: unless-stopped` turns it into a crash
      # loop and the operator's only evidence is this message.
      #
      # No `--restart` here on purpose: the point is to read the error once,
      # not to reproduce the loop.
      - name: It must refuse a database from a newer Cogwheel, legibly
        run: |
          set -euo pipefail
          SUPPORTED="$(sed -n 's/^pub const SCHEMA_VERSION: i64 = \([0-9]\+\);.*/\1/p' \
            crates/cogwheel-storage/src/lib.rs | head -n 1)"
          FUTURE=$(( SUPPORTED + 1 ))
          echo "this build understands v${SUPPORTED}; presenting it with v${FUTURE}"

          mkdir -p "${RUNNER_TEMP}/newer"
          python3 - "${RUNNER_TEMP}/newer/cogwheel.db" "$FUTURE" <<'PY'
          import sqlite3, sys

          db = sqlite3.connect(sys.argv[1])
          # Enough to be a real SQLite file. Storage reads user_version before
          # it reads anything else, so the contents past that do not matter.
          db.executescript(f"CREATE TABLE marker (x); PRAGMA user_version = {int(sys.argv[2])};")
          db.commit()
          db.close()
          PY

          docker volume create cogwheel-newer >/dev/null
          docker run --rm --user 0 --entrypoint /bin/sh \
            -v cogwheel-newer:/app/data -v "${RUNNER_TEMP}/newer:/seed:ro" cogwheel:ci \
            -c 'cp /seed/cogwheel.db /app/data/cogwheel.db && chown 10001:10001 /app/data/cogwheel.db'

          set +e
          LOGS=$(docker run --name cogwheel-newer \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            -e COGWHEEL_SERVER__HTTP_BIND_ADDR=0.0.0.0:8080 \
            -e COGWHEEL_SERVER__DNS_UDP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_SERVER__DNS_TCP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_STORAGE__DATABASE_URL=sqlite:///app/data/cogwheel.db \
            -v cogwheel-newer:/app/data --read-only --tmpfs /tmp:rw,size=64m --init \
            cogwheel:ci 2>&1)
          STATUS=$?
          set -e
          docker rm -f cogwheel-newer >/dev/null 2>&1 || true
          echo "$LOGS"

          if [ "$STATUS" -eq 0 ]; then
            echo "::error::the server started on a v${FUTURE} database instead of refusing it"
            exit 1
          fi
          case "$LOGS" in
            *"is from a newer Cogwheel"*) ;;
            *) echo "::error::it refused, but not with the schema-version message an operator needs"; exit 1 ;;
          esac
          case "$LOGS" in
            *"schema version is ${FUTURE}"*) ;;
            *) echo "::error::the message does not name the version it found (${FUTURE})"; exit 1 ;;
          esac
          case "$LOGS" in
            *"understands ${SUPPORTED}"*) ;;
            *) echo "::error::the message does not name the version this build supports (${SUPPORTED})"; exit 1 ;;
          esac
          echo "refused with a message that names both versions"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs cogwheel-ci 2>&1 | tail -50 || true
          docker logs cogwheel-upgrade 2>&1 | tail -50 || true
          docker logs cogwheel-newer 2>&1 | tail -50 || true

  deploy-assets:
    name: shell + yaml + systemd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m pip install --quiet yamllint

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            echo "sh -n $f"
            sh -n "$f"
          done

      # No -s override: shellcheck picks the dialect from each shebang, so the
      # POSIX installers are checked as sh and legacy helpers as bash.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: YAML parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob('.github/workflows/*.yml')) + ['docker-compose.yml']
          bad = False
          for f in files:
              try:
                  yaml.safe_load(open(f))
                  print(f'ok   {f}')
              except Exception as e:
                  print(f'FAIL {f}: {e}')
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      # Parsing is not the same as Compose accepting it, and the difference is
      # where the real mistakes live: a bad interpolation default, an option
      # the schema does not have, a service that silently resolves to nothing.
      #
      # `config` is run in an empty directory on purpose. A fresh clone has no
      # .env, and until `required: false` that made every compose verb -- pull,
      # down, logs, config -- fail outright, which left anyone who deleted a bad
      # .env with a project they could not even stop.
      - name: Compose files are valid with no .env present
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp docker-compose.yml "$work/docker-compose.yml"
          ( cd "$work" && docker compose config -q )
          echo "ok   docker-compose.yml (no .env)"

          # And the two files scripts/install.sh writes on a household box. They
          # are only ever seen by users, so this is the only place they get
          # checked before somebody's Raspberry Pi runs them.
          for mode in host bridge; do
            sh scripts/install.sh --print-compose --network "$mode" > "$work/${mode}.yml"
            ( cd "$work" && docker compose -f "${mode}.yml" config -q )
            echo "ok   install.sh --network ${mode}"
          done

      # `image:` and `build:` on the same service means Compose builds when the
      # image is missing -- that is the default policy, not an opt-in. On a
      # Raspberry Pi it turns `docker compose up -d` into a multi-hour Rust
      # compile with no indication that is what is happening. It was there once;
      # this is what stops it coming back.
      - name: The production compose file must not build from source
        run: |
          if grep -qE '^[[:space:]]+build:' docker-compose.yml; then
            echo "::error file=docker-compose.yml::a build: block makes 'docker compose up' compile on a host with no image"
            exit 1
          fi
          if sh scripts/install.sh --print-compose | grep -qE '^[[:space:]]+build:'; then
            echo "::error file=scripts/install.sh::the generated compose file contains a build: block"
            exit 1
          fi
          echo "no build: block in either compose file"

      # The schema-version label is what an operator (and scripts/install.sh,
      # and anyone deciding whether an upgrade needs a snapshot) reads BEFORE
      # pulling an image. A label that has drifted from the code is worse than
      # no label, because it is the input to a rollback decision.
      - name: The schema-version label matches the code
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/^pub const SCHEMA_VERSION: i64 = \([0-9]\+\);.*/\1/p' \
            crates/cogwheel-storage/src/lib.rs | head -n 1)"
          LABEL="$(sed -n 's/^ARG SCHEMA_VERSION=\([0-9]\+\).*/\1/p' Dockerfile | head -n 1)"
          echo "crates/cogwheel-storage/src/lib.rs: ${CODE}"
          echo "Dockerfile ARG SCHEMA_VERSION:      ${LABEL}"
          if [ -z "$CODE" ] || [ -z "$LABEL" ]; then
            echo "::error::could not read one of the two schema version declarations"
            exit 1
          fi
          if [ "$CODE" != "$LABEL" ]; then
            echo "::error file=Dockerfile::schema version mismatch: code says ${CODE}, Dockerfile says ${LABEL}"
            exit 1
          fi
          echo "agree"

      # Unraid's Docker tab reads this template, and its update check works by
      # comparing the digest on disk against the registry's for the SAME tag.
      # A pinned tag therefore reports "up-to-date" forever, including through
      # a security release -- so the recommended tag has to be a moving one.
      - name: Unraid template is well-formed and tracks a moving tag
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse('deploy/unraid/cogwheel.xml').getroot()
          problems = []

          repo = (root.findtext('Repository') or '').strip()
          if not repo.endswith(':latest'):
              problems.append(
                  f"Repository is {repo!r}; Unraid's update check compares digests for one "
                  "tag, so a pinned tag can never report an update"
              )

          for field in ('Name', 'Repository', 'Overview', 'WebUI', 'Icon', 'Support', 'Project'):
              if not (root.findtext(field) or '').strip():
                  problems.append(f'<{field}> is empty')

          targets = {c.get('Target') for c in root.findall('Config')}
          if '/app/data' not in targets:
              problems.append('no Config maps /app/data, so the database would not persist')

          extra = root.findtext('ExtraParams') or ''
          if 'NET_BIND_SERVICE' not in extra:
              problems.append(
                  'ExtraParams does not add NET_BIND_SERVICE; the binary carries a file '
                  'capability with the effective bit set, so execve fails without it'
              )

          for p in problems:
              print(f'::error file=deploy/unraid/cogwheel.xml::{p}')
          sys.exit(1 if problems else 0)
          PY
          echo "ok   deploy/unraid/cogwheel.xml"

          python3 -c "import xml.etree.ElementTree as ET; ET.parse('deploy/unraid/cogwheel.svg')"
          echo "ok   deploy/unraid/cogwheel.svg"

      # rust-toolchain.toml governs every cargo invocation, including the ones
      # inside the Docker build. If the base image were a different version,
      # rustup would quietly download a second compiler partway through the
      # image build -- slow, network-dependent, and invisible until it fails.
      # Two lines in two files, so assert they agree rather than hope.
      - name: Rust pin matches the Dockerfile base image
        run: |
          PINNED="$(awk -F'"' '/^channel = / { print $2; exit }' rust-toolchain.toml)"
          IMAGE="$(awk -F= '/^ARG RUST_VERSION=/ { print $2; exit }' Dockerfile)"
          echo "rust-toolchain.toml: ${PINNED}"
          echo "Dockerfile:          ${IMAGE}"
          if [ -z "$PINNED" ] || [ -z "$IMAGE" ]; then
            echo "::error::could not read one of the two Rust version pins"
            exit 1
          fi
          if [ "$PINNED" != "$IMAGE" ]; then
            echo "::error::Rust pin mismatch: rust-toolchain.toml says ${PINNED}, Dockerfile says ${IMAGE}"
            exit 1
          fi
          echo "agree"

      - name: Systemd unit
        run: |
          # systemd-analyze checks ExecStart is executable, so give it a stub.
          sudo install -Dm0755 /dev/null /usr/local/bin/cogwheel-server
          systemd-analyze verify deploy/cogwheel.service
          sudo rm -f /usr/local/bin/cogwheel-server

      # This is a product, not one person's box. `git grep` is used rather than
      # plain grep so only tracked files are searched -- build output under
      # dist/ and target/ is irrelevant and would produce false positives.
      #
      # There is exactly one exclusion, and it is unavoidable: this file, which
      # necessarily contains the patterns themselves. docs/ is NOT excluded --
      # a documentation file that quotes a personal hostname still ships that
      # hostname in the repository, and an exclusion that exists to let the one
      # surviving violation through is not a check, it is a green light.
      - name: No personal hostnames, users or LAN addresses
        run: |
          if git grep -nE '(michaelwong|fractal\.local|192\.168\.86\.[0-9]+)' -- \
               ':!.github/workflows/ci.yml'; then
            echo "::error::personal hostname, username or LAN address found above"
            exit 1
          fi
          echo "clean"
