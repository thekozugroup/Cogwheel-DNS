name: release

# Fires on a version tag. Produces, for one tag:
#   - a multi-arch image on GHCR (linux/amd64 + linux/arm64)
#   - static binaries for x86_64 and aarch64, bundled with the web assets
#   - SHA256SUMS for every artifact
#   - an SPDX SBOM for the source tree and for the image
#   - signed build-provenance attestations for both the image and the binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # Facts every downstream job needs, computed once.
  # ==========================================================================
  meta:
    name: metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_name: ${{ steps.v.outputs.image_name }}
      created: ${{ steps.v.outputs.created }}
      schema_version: ${{ steps.v.outputs.schema_version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # A container tag may not contain '+', and this string is used
            # verbatim as an image tag by the manifest job. Semver build
            # metadata ("0.0.0-dev+abc1234") would make every reference derived
            # from it an invalid reference format, so use a '.' separator.
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi

          # A container tag is [A-Za-z0-9_][A-Za-z0-9._-]{0,127}. Catch a tag
          # this workflow cannot turn into a valid image reference (v1.0.0+meta,
          # a tag with a '/', ...) here, in the first job, instead of five jobs
          # later inside `docker buildx imagetools`.
          case "$VERSION" in
            ''|*[!A-Za-z0-9._-]*|[!A-Za-z0-9_]*)
              echo "::error::tag '${GITHUB_REF_NAME}' yields '${VERSION}', which is not a valid container tag"
              exit 1 ;;
          esac

          # Being a legal container tag is not enough -- it must also be semver.
          # The manifest job derives ":latest" and "{{major}}.{{minor}}" from a
          # semver PARSE. A tag like "vNext" is a perfectly legal container tag,
          # so it sails past the check above, gets pushed, repoints :latest at
          # itself -- and only then do the semver patterns produce nothing and
          # the run dies, leaving a half-published release and every appliance
          # on the planet pulling whatever "vNext" happened to be. Reject it
          # here, in the first job, where nothing has been pushed yet.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] &&
             ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not semver; expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi

          # GHCR rejects uppercase path segments, and this repository name has
          # them. Lowercase it rather than hardcoding the owner.
          IMAGE_NAME="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # The schema version this build understands, lifted from the one
          # place that defines it. It becomes an OCI label on the image, which
          # is what lets an operator -- or scripts/install.sh, or the Unraid
          # update check -- tell BEFORE pulling whether a release will migrate
          # their database and therefore whether rolling back afterwards needs
          # the .pre-vN snapshot restoring first.
          SCHEMA_VERSION="$(sed -n 's/^pub const SCHEMA_VERSION: i64 = \([0-9]\+\);.*/\1/p' \
            crates/cogwheel-storage/src/lib.rs | head -n 1)"
          if [ -z "${SCHEMA_VERSION}" ]; then
            echo "::error::could not read SCHEMA_VERSION from crates/cogwheel-storage/src/lib.rs"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "image_name=${IMAGE_NAME}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "schema_version=${SCHEMA_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${VERSION} as ${IMAGE_NAME} (database schema v${SCHEMA_VERSION})"

          # Fatal, not advisory. The Settings page reports CARGO_PKG_VERSION
          # (apps/cogwheel-server/src/api/settings.rs), which is the only place
          # in the product an operator can see what they are running -- so a tag
          # that disagrees with Cargo.toml produces an image that misreports
          # itself for the life of that release, and every test passes either
          # way. This used to be a `::warning::`, which is to say nothing.
          #
          # The prerelease suffix is stripped before comparing: v0.2.0-rc.1 is
          # built from the 0.2.0 source, and requiring Cargo.toml to carry
          # `-rc.1` would mean a commit whose only purpose is to be reverted.
          #
          # awk rather than `sed ... | head -1`: under `set -o pipefail` the
          # early close by head can surface as SIGPIPE and fail this step, and
          # this job gates every other one.
          EXPECTED="${VERSION%%-*}"
          MANIFEST_VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ "${MANIFEST_VERSION}" != "${EXPECTED}" ]; then
            echo "::error file=Cargo.toml::workspace version is ${MANIFEST_VERSION}; the tag says ${EXPECTED}"
            echo "Bump the version in Cargo.toml, commit, then move the tag."
            exit 1
          fi
          echo "Cargo.toml reports ${MANIFEST_VERSION}"

  # ==========================================================================
  # Web assets: architecture-independent, so built exactly once and reused by
  # every binary tarball.
  # ==========================================================================
  web:
    name: web assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cogwheel-web/package-lock.json
      - run: npm ci
        working-directory: apps/cogwheel-web
      - run: npm run build
        working-directory: apps/cogwheel-web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/cogwheel-web/dist
          retention-days: 1

  # ==========================================================================
  # One image per architecture, pushed by digest. They are stitched into a
  # single manifest list by the `manifest` job.
  # ==========================================================================
  image:
    name: image (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # Native arm64 runner. Building this under QEMU regularly exceeds the
          # job time limit for a Rust workspace this size.
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # NOT `push: true`. The push is declared inside `outputs` below, and
          # the action turns `push: true` into a SECOND `--output type=image,
          # push=true` -- one with no name attached. Buildx accepts both and
          # then fails the job with "tag is needed when pushing to registry".
          # This matches docker/build-push-action's own push-by-digest example.
          #
          # provenance must stay false: buildx would otherwise attach an
          # attestation manifest to each per-arch push, and `imagetools create`
          # in the next job would fold those into the manifest list as if they
          # were platforms.
          provenance: false
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.meta.outputs.created }}
            SCHEMA_VERSION=${{ needs.meta.outputs.schema_version }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # build-push-action emits the digest as "sha256:<64 hex>". The
          # manifest job rebuilds each reference as "<image>@sha256:<filename>",
          # so the algorithm prefix MUST be stripped here. Leaving it on
          # produces "<image>@sha256:sha256:<hex>", which buildx rejects with
          # "invalid reference format" -- and that failure takes the whole
          # release down, because `publish` needs `manifest`.
          hex="${DIGEST#sha256:}"
          case "$hex" in
            *[!0-9a-f]*|"") echo "::error::unexpected digest format: ${DIGEST}"; exit 1 ;;
          esac
          if [ "${#hex}" -ne 64 ]; then
            echo "::error::digest is not 64 hex characters: ${DIGEST}"
            exit 1
          fi
          touch "/tmp/digests/${hex}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Combine the per-arch images into one multi-arch tag, then attest it.
  # ==========================================================================
  manifest:
    name: multi-arch manifest
    needs: [meta, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # `imagetools create` needs index-level annotations, not manifest-level
          # ones: the thing a tag resolves to here is the manifest list, and GHCR
          # reads the index's annotations to link the package to its repository
          # and show a description. This is what makes the `annotations` output
          # below usable rather than decorative.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image_name }}
          # The semver patterns only match a tag ref. On workflow_dispatch they
          # produce nothing at all, and `imagetools create` with no -t is an
          # error -- so a dispatch run gets the dev version computed by `meta`
          # as its single tag. `Resolve the manifest digest` below looks the
          # image up by exactly that version, so the two must agree.
          # `latest` is deliberately NOT applied to every tag. It is the tag a
          # household actually follows: scripts/install.sh writes it into
          # /etc/cogwheel/.env, `docker compose pull` resolves it on every
          # upgrade, and Unraid's "check for updates" compares its digest.
          # Whatever `latest` points at is therefore what every appliance moves
          # onto unattended, so tagging a prerelease as latest would ship a
          # release candidate to people who never opted into one.
          # A semver prerelease always carries a '-' (v0.2.0-rc.1); build
          # metadata ('+') is already rejected by the meta job.
          #
          # Tags, so an operator can choose how closely to follow:
          #   1.2.3   exactly this release, forever
          #   1.2     the newest 1.2.x -- fixes only
          #   1       the newest 1.x -- no breaking change
          #   latest  the newest final release
          # `{{major}}` is skipped below 1.0.0: a "0" tag would promise a stable
          # major line that 0.x explicitly does not have, and semver says so. A
          # 0.x tag therefore publishes three of these, not four; nothing in the
          # docs or the release body should claim a fixed count.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ needs.meta.outputs.version }},enable=${{ github.ref_type != 'tag' }}
          # Spelled out rather than inferred from the repository description,
          # which is editable in the GitHub UI and would silently change what
          # every published index says about itself. These mirror the Dockerfile's
          # per-architecture labels so the index and the images agree.
          labels: |
            org.opencontainers.image.title=Cogwheel DNS
            org.opencontainers.image.description=Network-wide DNS ad and tracker blocking, with per-device policy
            org.opencontainers.image.vendor=The Kozu Group
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT.md

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # Every file here is named for the BARE hex digest of one per-arch
          # image (the image job strips the "sha256:" prefix), so a reference
          # is "<registry>/<image>@sha256:<64 hex>". Both halves are validated
          # rather than assumed: an empty tag list or a malformed filename
          # would otherwise reach buildx as "invalid reference format" -- or,
          # worse, create a manifest under a tag nobody expects.
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [ -z "$tags" ]; then
            echo "::error::docker/metadata-action produced no tags for ${GITHUB_REF_NAME}"
            exit 1
          fi

          refs=""
          for digest in *; do
            case "$digest" in
              *[!0-9a-f]*|"") echo "::error::not a bare digest filename: ${digest}"; exit 1 ;;
            esac
            refs="${refs} ${REGISTRY}/${IMAGE_NAME}@sha256:${digest}"
          done
          if [ -z "$refs" ]; then
            echo "::error::no per-architecture digests were downloaded"
            exit 1
          fi

          # Annotations, on the INDEX rather than on each per-arch manifest.
          # `imagetools create` does not inherit annotations from the manifests
          # it stitches together, so without this the thing `:latest` actually
          # resolves to carries none -- and GHCR reads exactly those to link the
          # package to this repository and show a description. They come from
          # the same metadata-action step as the tags, which is what stops that
          # step's `annotations` output from being computed and thrown away.
          #
          # An array, not a string: the description contains spaces, so word
          # splitting -- correct for the tags and refs below -- would shred it
          # into six arguments buildx does not understand.
          annotations=()
          while IFS= read -r line; do
            [ -n "$line" ] && annotations+=(--annotation "$line")
          done <<< "$INDEX_ANNOTATIONS"
          if [ "${#annotations[@]}" -eq 0 ]; then
            echo "::warning::docker/metadata-action produced no index annotations"
          fi

          echo "creating: docker buildx imagetools create ${annotations[*]} ${tags}${refs}"
          # Word splitting is the point for these two: both are pre-built
          # argument lists of tokens that cannot contain spaces.
          # shellcheck disable=SC2086
          docker buildx imagetools create "${annotations[@]}" $tags $refs
        env:
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          INDEX_ANNOTATIONS: ${{ steps.meta.outputs.annotations }}

      - name: Resolve the manifest digest
        id: digest
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$REF"
        env:
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          VERSION: ${{ needs.meta.outputs.version }}

      # The one check that decides whether the advertised install actually
      # works. A GHCR package created by a workflow push is PRIVATE by default,
      # even from a public repository -- publishing does not make it pullable.
      # A private package means `curl … | sudo sh` on a Raspberry Pi fails at
      # `docker pull` with "denied", for every user, while the release page
      # looks perfectly healthy.
      #
      # So this is checked the way a user experiences it: an anonymous token,
      # no credentials, exactly what an unauthenticated Pi gets. It runs BEFORE
      # `publish` (which needs this job) so a failure means no GitHub Release is
      # created advertising an image nobody can pull. The images themselves stay
      # pushed and are reused as-is on re-run, so the fix is: flip visibility,
      # re-run the failed jobs. Expect this to fire exactly once, on the first
      # release that ever creates the package.
      - name: The published image must be pullable without credentials
        env:
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -uo pipefail
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
                  | jq -r '.token // empty')
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer ${TOKEN:-}" \
                   -H 'Accept: application/vnd.oci.image.index.v1+json' \
                   -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                   "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "anonymous pull of ${IMAGE_NAME}:${VERSION} -> HTTP ${CODE} (public, the installer will work)"
            exit 0
          fi
          echo "::error::ghcr.io/${IMAGE_NAME}:${VERSION} is NOT anonymously pullable (HTTP ${CODE}). The one-line installer would fail for every user."
          {
            echo "### Release blocked: the container package is private"
            echo
            echo "\`ghcr.io/${IMAGE_NAME}:${VERSION}\` returned HTTP \`${CODE}\` to an"
            echo "unauthenticated pull, which is what a Raspberry Pi running the documented"
            echo "installer does. \`docker pull\` would fail with \`denied\`."
            echo
            echo "This is expected on the FIRST release: GHCR creates packages private."
            echo
            echo "**Fix (one time, ~20 seconds):**"
            echo
            echo "1. Open <https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${IMAGE_NAME##*/}>"
            echo "   (for a user account: <https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${IMAGE_NAME##*/}>)"
            echo "2. **Package settings** → **Danger Zone** → **Change visibility** → **Public**"
            echo "3. Re-run the failed jobs on this workflow run."
            echo
            echo "The images are already pushed; the re-run reuses them and only publishes the release."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # A pushed image that cannot start is worse than no release: `latest` now
      # points at it, and every appliance that runs `docker compose pull` takes
      # it. CI exercises this Dockerfile thoroughly, but CI builds its own
      # image -- it does not test the artifact. This does.
      #
      # Only linux/amd64 is started. The runner cannot run the arm64 image at
      # native speed, and an emulated boot proves little beyond "qemu works";
      # the arm64 half is covered by ci.yml running the same Dockerfile on a
      # native arm64 runner.
      #
      # The version assertion closes the Cargo.toml-mismatch hole from the
      # other end: `meta` checks the source, this checks the binary that was
      # actually published, via the one endpoint the Settings page reads.
      - name: The published image must start, serve, and report its own version
        env:
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          VERSION: ${{ needs.meta.outputs.version }}
          SCHEMA_VERSION: ${{ needs.meta.outputs.schema_version }}
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          # Bridge networking with :5353 inside the container: the runner's own
          # systemd-resolved holds :53. NET_BIND_SERVICE is still required --
          # the binary carries the capability as a file capability, so execve
          # fails without it whatever port would be bound.
          docker run -d --name cogwheel-release \
            --platform linux/amd64 \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --init \
            -e COGWHEEL_SERVER__HTTP_BIND_ADDR=0.0.0.0:8080 \
            -e COGWHEEL_SERVER__DNS_UDP_BIND_ADDR=0.0.0.0:5353 \
            -e COGWHEEL_SERVER__DNS_TCP_BIND_ADDR=0.0.0.0:5353 \
            -p 18080:8080/tcp "$REF"

          ready=no
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:18080/health/ready; then
              echo "ready after ${attempt} attempts"; ready=yes; break
            fi
            sleep 3
          done
          if [ "$ready" != yes ]; then
            echo "::error::the published image never became ready"
            docker logs cogwheel-release 2>&1 | tail -80
            exit 1
          fi

          body="$(curl -fsS --max-time 10 http://127.0.0.1:18080/api/v1/settings)"
          reported="$(jq -r '.data.version' <<< "$body")"
          schema="$(jq -r '.data.schema_version' <<< "$body")"

          # The tag may carry a prerelease suffix that the manifests do not:
          # v0.2.0-rc.1 is built from the 0.2.0 source.
          expected="${VERSION%%-*}"
          if [ "$reported" != "$expected" ]; then
            echo "::error::the published image reports version ${reported}; the tag says ${expected}"
            exit 1
          fi
          if [ "$schema" != "$SCHEMA_VERSION" ]; then
            echo "::error::the published image reports schema v${schema}; the source says v${SCHEMA_VERSION}"
            exit 1
          fi

          # And the label an operator reads BEFORE pulling has to agree with
          # what the running binary then says. A label that drifts is worse
          # than no label, because it is the input to a rollback decision.
          labelled="$(docker image inspect --format '{{index .Config.Labels "io.cogwheel.schema-version"}}' "$REF")"
          if [ "$labelled" != "$SCHEMA_VERSION" ]; then
            echo "::error::io.cogwheel.schema-version is '${labelled}'; the source says ${SCHEMA_VERSION}"
            exit 1
          fi

          echo "published image: version ${reported}, database schema v${schema}, label agrees"
          docker rm -f cogwheel-release >/dev/null

      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate the image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image_name }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          artifact-name: cogwheel-image-sbom.spdx.json
          output-file: /tmp/cogwheel-image-sbom.spdx.json

      - name: Attest the image SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.meta.outputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: /tmp/cogwheel-image-sbom.spdx.json
          push-to-registry: true

  # ==========================================================================
  # Standalone binaries for the native (non-Docker) install path.
  #
  # Cross-compiled from x86_64 on purpose rather than built on native runners:
  # it keeps the release reproducible on any ubuntu-latest runner, and it is
  # cheap here because reqwest uses rustls (no OpenSSL to cross-build). The one
  # thing that does need a cross C toolchain is rusqlite's `bundled` feature,
  # which compiles the SQLite amalgamation -- hence gcc-aarch64-linux-gnu and
  # the CC_/AR_/LINKER triple variables below.
  # ==========================================================================
  binaries:
    name: binary (${{ matrix.target }})
    needs: [meta, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      # The released binary is built by the compiler pinned in
      # rust-toolchain.toml -- the same one CI tested with -- rather than
      # whatever `stable` happens to be on release day. Both matrix targets are
      # listed in that file, so nothing here needs to name a target.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked -p cogwheel-server --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Package
        run: |
          set -euo pipefail
          NAME="cogwheel-${VERSION}-${TARGET}"
          mkdir -p "stage/${NAME}"
          install -Dm0755 "target/${TARGET}/release/cogwheel-server" "stage/${NAME}/cogwheel-server"
          cp -R dist "stage/${NAME}/web"
          install -Dm0644 deploy/cogwheel.service "stage/${NAME}/deploy/cogwheel.service"
          install -Dm0755 scripts/install-native.sh "stage/${NAME}/scripts/install-native.sh"
          install -Dm0755 scripts/install.sh "stage/${NAME}/scripts/install.sh"
          install -Dm0755 scripts/verify-install.sh "stage/${NAME}/scripts/verify-install.sh"
          install -Dm0755 scripts/check-update.sh "stage/${NAME}/scripts/check-update.sh"
          install -Dm0644 docker-compose.yml "stage/${NAME}/docker-compose.yml"
          install -Dm0644 .env.example "stage/${NAME}/.env.example"
          install -Dm0644 deploy/unraid/cogwheel.xml "stage/${NAME}/deploy/unraid/cogwheel.xml"
          install -Dm0644 docs/DEPLOYMENT.md "stage/${NAME}/docs/DEPLOYMENT.md"
          tar -czf "${NAME}.tar.gz" -C stage "${NAME}"
          sha256sum "${NAME}.tar.gz"
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: cogwheel-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Publish: checksums, source SBOM, provenance, GitHub Release.
  # ==========================================================================
  publish:
    name: publish release
    # `manifest` is a deliberate dependency, not an accident: the release notes
    # below advertise a container tag, and publishing a release that points at
    # an image that was never pushed is worse than publishing nothing. It is
    # also why a bug in the manifest job silently costs you the entire release
    # -- see the digest handling in `image`/`manifest` above.
    needs: [meta, binaries, manifest]
    # `gh release create` takes GITHUB_REF_NAME as the tag. On workflow_dispatch
    # that is a branch name, which would create a tag named after the branch.
    # A dispatch run is a build, not a release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tarball-*
          merge-multiple: true

      - name: Generate the source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: cogwheel-source-sbom.spdx.json
          output-file: artifacts/cogwheel-${{ needs.meta.outputs.version }}-source-sbom.spdx.json

      # Checksums are computed last, over everything that will be attached, so
      # SHA256SUMS covers the SBOM as well as the tarballs.
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance for the release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.spdx.json

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          IMAGE_NAME: ${{ needs.meta.outputs.image_name }}
          SCHEMA_VERSION: ${{ needs.meta.outputs.schema_version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # The release body leads with CHANGELOG.md rather than with generated
          # commit subjects. Somebody deciding whether to take an update to the
          # thing that resolves every name in their house needs to know what
          # changed and whether it needs their attention; a list of commit
          # titles does not tell them that.
          #
          # The awk stops at the next version heading AND at the link-reference
          # block at the foot of the file -- without that second rule the newest
          # entry, which has no heading after it, swallows the `[0.1.0]: https…`
          # lines into the release body.
          : > notes.md
          if [ -f CHANGELOG.md ] && awk -v v="${VERSION}" '
                $0 ~ "^## \\[" v "\\]" { found = 1; next }
                found && /^## \[/ { exit }
                found && /^\[[^]]+\]: / { exit }
                found { print }
              ' CHANGELOG.md > changelog.md && [ -s changelog.md ]; then
            cat changelog.md >> notes.md
            printf '\n' >> notes.md
            echo "found a changelog section for ${VERSION}"
          else
            echo "::warning::CHANGELOG.md has no section for ${VERSION}; released with a pointer"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n\n' \
              "${GITHUB_REPOSITORY}" "${TAG}" >> notes.md
          fi

          cat >> notes.md <<NOTES
          ---

          ## Install

          One line, on the machine that will run Cogwheel:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/scripts/install.sh | sudo sh
          \`\`\`

          It writes a Docker Compose project to \`/etc/cogwheel\` and starts it.

          ## Upgrading

          A host set up by the installer, or any other Compose install, upgrades
          with two commands from the directory holding its compose file:

          \`\`\`sh
          cd /etc/cogwheel
          sudo docker compose pull && sudo docker compose up -d
          \`\`\`

          On Unraid it is the Docker tab's **Apply Update**. A native install is
          rebuilt, or re-installed from this release's tarball — see
          [DEPLOYMENT.md §10](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/DEPLOYMENT.md#10-upgrades-and-rollback).

          ## Container image

          \`\`\`
          ${REGISTRY}/${IMAGE_NAME}:${VERSION}
          \`\`\`

          Multi-arch: \`linux/amd64\` and \`linux/arm64\` (Raspberry Pi 5).

          Pick the tag that matches how closely you want to follow releases:

          | Tag | You get |
          | --- | --- |
          | \`${VERSION}\` | exactly this release, forever |
          | \`\${VERSION%.*}\` | the newest patch on this minor line |
          | \`latest\` | the newest final release, never a prerelease |

          \`latest\` is the default the installer and the Unraid template use,
          and that is deliberate: a moving tag is what makes \`docker compose
          pull\` an upgrade, and it is the only thing an Unraid-style update
          check can compare a digest against.

          ## Database schema

          This release understands schema **v${SCHEMA_VERSION}**, published on the image as
          \`io.cogwheel.schema-version\`. Read it from any tag without pulling it:

          \`\`\`sh
          docker buildx imagetools inspect ${REGISTRY}/${IMAGE_NAME}:${VERSION} \\
            --format '{{ json .Image.Config.Labels }}'
          \`\`\`

          If that number is higher than the one you are running, this upgrade
          migrates your database in place and leaves a copy of the previous file
          beside it as \`cogwheel.db.pre-v${SCHEMA_VERSION}\`. Rolling back across
          that point means restoring the copy first — an older build refuses to
          open a database it does not recognise, and \`restart: unless-stopped\`
          turns that refusal into a crash loop.

          ## Rolling back

          Pin the release you want in \`/etc/cogwheel/.env\` and bring it up:

          \`\`\`sh
          cd /etc/cogwheel
          sudo sed -i 's|^COGWHEEL_IMAGE=.*|COGWHEEL_IMAGE=${REGISTRY}/${IMAGE_NAME}:PREVIOUS|' .env
          sudo docker compose pull && sudo docker compose up -d
          \`\`\`

          Read the schema note above first.

          ## Verifying what you downloaded

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify cogwheel-${VERSION}-aarch64-unknown-linux-gnu.tar.gz -R ${GITHUB_REPOSITORY}
          gh attestation verify oci://${REGISTRY}/${IMAGE_NAME}:${VERSION} -R ${GITHUB_REPOSITORY}
          \`\`\`

          An SPDX SBOM for the source tree is attached; the image SBOM is
          attested to the image itself.

          See [docs/DEPLOYMENT.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/DEPLOYMENT.md)
          for upgrades, troubleshooting and backing up the data volume.
          NOTES

          # Create-or-update rather than create.
          #
          # Two ordinary situations reach this step with the release already
          # present, and `gh release create` fails outright on both:
          #
          #   - The tag was made through the GitHub UI ("Draft a new release"),
          #     which is the easiest way to start a release and creates the
          #     release object before this workflow ever runs.
          #   - This job is re-run. That is expected at least once: the manifest
          #     job blocks the first release until the GHCR package is made
          #     public, and re-running is the documented fix.
          #
          # Failing there would mean a tag with images published and no release
          # notes or artifacts attached to it.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists -- attaching artifacts and refreshing notes"
            gh release upload "${TAG}" artifacts/* --clobber
            gh release edit "${TAG}" \
              --title "Cogwheel ${TAG}" \
              --notes-file notes.md
          else
            gh release create "${TAG}" \
              --title "Cogwheel ${TAG}" \
              --notes-file notes.md \
              --generate-notes \
              artifacts/*
          fi
